name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: |
          npm ci || npm install

      - name: Expo Prebuild (Generate Android Native Project)
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Extract Version Tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v1.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building SentiVox $VERSION"

      - name: Locate and Rename APK
        id: apk
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            find mobile/android/app/build/ -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          
          mkdir -p build_output
          FINAL_NAME="SentiVox-${{ steps.version.outputs.version }}.apk"
          cp "$APK_PATH" "build_output/$FINAL_NAME"
          
          echo "apk_path=build_output/$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          
          echo "APK Details:"
          ls -lh "build_output/$FINAL_NAME"

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentivox-apk
          path: build_output/*.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          tag_name: ${{ github.ref_name }}
          name: "SentiVox Mobile Release ${{ github.ref_name }}"
          body: |
            ## 🎙️ SentiVox Mobile ${{ github.ref_name }}

            Enterprise Speech Emotion Recognition — Android Release.

            ### 📲 Install
            Download **${{ steps.apk.outputs.apk_name }}** below and install on your Android device.

            ### ✨ Features
            - ⚡ Real-Time Voice Emotion Analysis (7-class probability breakdown)
            - 🔒 JWT Secure Authentication & Role-Based Access Control
            - 🧠 Model Hot-Swapping & Admin Control Panel
            - 📜 Prediction History Tracking
            - 🌐 Connected to production server at `144.24.142.3`

            ### 🖥️ Backend
            - API Endpoint: `http://144.24.142.3:8000`
            - Health Check: `http://144.24.142.3/health`

            ### 📋 Requirements
            - Android 6.0+ (API 23+)
            - Microphone permission required
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
