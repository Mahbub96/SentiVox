# SentiVox — Nginx Reverse Proxy Configuration
# Server: 144.24.142.3 (Oracle Cloud)
# Copy to: /etc/nginx/sites-available/sentivox

upstream sentivox_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name 144.24.142.3;

    # ─── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Request Size Limit (must match MAX_FILE_SIZE_MB) ─────
    client_max_body_size 20M;

    # ─── API Backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://sentivox_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for inference requests (can be slow on CPU)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    location /health {
        proxy_pass http://sentivox_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ready {
        proxy_pass http://sentivox_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Swagger Docs (disabled in production via FastAPI config) ──
    location /docs {
        proxy_pass http://sentivox_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://sentivox_backend;
        proxy_set_header Host $host;
    }

    # ─── Static Dashboard ─────────────────────────────────────
    location /static/ {
        proxy_pass http://sentivox_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://sentivox_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/sentivox_access.log;
    error_log /var/log/nginx/sentivox_error.log;
}
